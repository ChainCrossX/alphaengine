# Render Blueprint. Push this repo to GitHub, then go to
# https://render.com/deploy and point it at the repo. Render will detect
# this file and provision the web service + Postgres automatically.

services:
  - type: web
    name: alphaengine
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/state
    envVars:
      - key: PORT
        value: 8000
      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets
      - key: ALPACA_API_KEY
        sync: false           # set in dashboard
      - key: ALPACA_API_SECRET
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: ALPHAVANTAGE_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: FLASK_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alphaengine-db
          property: connectionString
    disk:
      name: alphaengine-cache
      mountPath: /app/.cache
      sizeGB: 1

databases:
  - name: alphaengine-db
    plan: basic_256mb        # cheapest current paid plan; use 'free' for 90-day trial
    databaseName: alphaengine
    user: alpha
