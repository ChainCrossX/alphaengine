# Fly.io deploy template. After `flyctl launch`, edit the app name as needed.
app = "alphaengine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  ALPACA_BASE_URL = "https://paper-api.alpaca.markets"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/state"
    timeout = "10s"

[mounts]
  source = "alphaengine_data"
  destination = "/app/.cache"
