# AlphaEngine Configuration
# All thresholds and parameters live here. No magic numbers in code.

mode: paper                 # paper | live
base_currency: USD
timezone: America/New_York

universe:
  symbols:
    - SPY
    - QQQ
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - META
    - GOOGL
    - TSLA
    - JPM
    - XOM
    - UNH
  benchmark: SPY
  min_avg_daily_volume: 5_000_000
  min_price: 5.00

data:
  primary_source: alpaca
  fallback_source: yfinance
  bar_timeframes: ["1Min", "5Min", "15Min", "1Hour", "1Day"]
  history_days: 365
  cache_dir: ./.cache
  redis_url: ${REDIS_URL:-}

signal_engine:
  ensemble_threshold: 0.72       # min ensemble confidence to fire
  min_confirming_strategies: 2   # require 2+ different categories agreeing
  regime_window_days: 60         # for vol regime detection
  high_vol_quantile: 0.75        # above this VIX percentile, favor mean reversion
  low_vol_quantile: 0.35         # below this, favor trend

  weights:
    momentum: 0.30
    mean_reversion: 0.25
    breakout: 0.20
    ml_model: 0.15
    sentiment: 0.05
    relative_strength: 0.05

  strategies:
    momentum:
      rsi_period: 14
      rsi_lower: 35
      rsi_upper: 65
      macd_fast: 12
      macd_slow: 26
      macd_signal: 9
      adx_period: 14
      adx_min_trend: 20
    mean_reversion:
      bb_period: 20
      bb_stddev: 2.0
      vwap_zscore_threshold: 2.0
    breakout:
      donchian_period: 20
      volume_multiplier: 1.5
    ml_model:
      retrain_interval_days: 7
      lookback_days: 365
      min_confidence: 0.58

risk:
  max_portfolio_drawdown_pct: 0.08
  max_single_position_loss_pct: 0.03
  max_single_position_size_pct: 0.12
  max_sector_exposure_pct: 0.30
  max_daily_loss_pct: 0.025
  max_open_positions: 10
  trailing_stop_activation_pct: 0.02
  trailing_stop_distance_pct: 0.012
  hard_stop_loss_pct: 0.03
  cooldown_after_breach_minutes: 1440  # 24h cooldown if a circuit breaker fires

position_sizing:
  method: half_kelly             # half_kelly | fixed_fractional | vol_target
  fixed_fraction: 0.05
  kelly_lookback_trades: 50
  kelly_max_fraction: 0.10
  vol_target_annual: 0.15
  vix_scaling:
    enabled: true
    reference_vix: 18
    min_scalar: 0.4
    max_scalar: 1.2
  intraday_dampening:
    open_window_minutes: 15
    close_window_minutes: 15
    open_close_scalar: 0.5

execution:
  default_order_type: limit
  limit_edge_bps: 5              # 5 basis points inside the spread
  max_retry_attempts: 4
  retry_backoff_seconds: 1.5
  market_order_fallback_after_retries: true
  pre_trade_validation: true

backtest:
  start_date: "2023-01-01"
  end_date: "2025-01-01"
  initial_capital: 100000
  commission_per_trade: 0.0      # Alpaca is commission-free, but model regulatory fees
  sec_fee_per_million_notional: 8.0
  taf_fee_per_share_sold: 0.000166
  slippage_bps: 3                # half-spread + impact
  borrow_cost_annual_pct: 0.04   # for short positions

alerting:
  slack:
    enabled: false
    webhook_url: ${SLACK_WEBHOOK_URL:-}
  discord:
    enabled: false
    webhook_url: ${DISCORD_WEBHOOK_URL:-}
  twilio:
    enabled: false
    account_sid: ${TWILIO_SID:-}
    auth_token: ${TWILIO_TOKEN:-}
    from_number: ${TWILIO_FROM:-}
    to_number: ${TWILIO_TO:-}
  events:
    trade_executed: true
    circuit_breaker: true
    daily_summary: true
    error: true

logging:
  level: INFO
  json: true
  file: ./logs/alphaengine.log
  rotate_max_bytes: 10485760
  rotate_backup_count: 7

scheduler:
  signal_loop_interval_seconds: 60
  rebalance_day: friday
  rebalance_hour_local: 15
  daily_summary_hour_local: 16
